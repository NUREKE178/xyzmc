name: Discord Link build

on:
  push:
    paths: ['discord-link/**', '.github/workflows/discord-link.yml']
  pull_request:
    paths: ['discord-link/**']

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: discord-link/bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: discord-link/plugin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: XYZDiscordLink
          path: discord-link/plugin/target/XYZDiscordLink-*.jar
